<text x="16" y="18.4" font-size="1.8" class="t" fill="#555">Decks stacked at 0 / 4 / 8 m; stepped bow and stern terraces; window bands as built (starboard hull facets and side walls).</text>
<text x="114" y="190" font-size="1.8" class="t">Deck 1 (command): FFL +8.000, rooms 3.4 m (bridge 4.2 m, lounge 3.6 m).</text>
<text x="114" y="194.2" font-size="1.8" class="t">Deck 2 (habitat): FFL +4.000, rooms 3.4 m (3.6 m mess, medbay, hydroponics).</text>
<text x="114" y="198.4" font-size="1.8" class="t">Deck 3 (engineering): FFL +0.000, rooms 3.4 m; hangar 8.0 m clear height on the stern platform.</text>
<text x="114" y="202.6" font-size="1.8" class="t">Slabs 300 mm; walls 150 mm.</text>
